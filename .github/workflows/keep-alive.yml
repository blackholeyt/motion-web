name: Keep Supabase awake

# Free Supabase projects pause after one week without activity. Once a day this calls the
# keep_alive() database function with the public key. It reads no user data.
# Needs the repository secrets SUPABASE_URL and SUPABASE_PUBLISHABLE_KEY (docs/BETRIEB.md).

on:
  schedule:
    - cron: '17 4 * * *'
  workflow_dispatch:

permissions: {}

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Call keep_alive()
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_PUBLISHABLE_KEY: ${{ secrets.SUPABASE_PUBLISHABLE_KEY }}
        run: |
          if [ -z "$SUPABASE_URL" ] || [ -z "$SUPABASE_PUBLISHABLE_KEY" ]; then
            echo "::warning::SUPABASE_URL or SUPABASE_PUBLISHABLE_KEY is not set; nothing to ping."
            exit 0
          fi
          response=$(curl --silent --show-error --fail --max-time 30 \
            -X POST "$SUPABASE_URL/rest/v1/rpc/keep_alive" \
            -H "apikey: $SUPABASE_PUBLISHABLE_KEY" \
            -H "Content-Type: application/json" \
            -d '{}')
          echo "Supabase answered: $response"
          test "$response" = '"ok"'
